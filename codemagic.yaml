workflows:
  flutter-android:
    name: Flutter Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6
    scripts:
      - name: Unpack and Prepare
        script: |
          unzip -o offline_ai_app-3.zip
          cd offline_ai_app
          flutter pub add fllama
      - name: Build Flutter APK
        script: |
          cd offline_ai_app
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - offline_ai_app/build/app/outputs/flutter-apk/*.apk

