name: offline_ai_app
description: "Барномаи чат-боти AI, ки бидуни интернет кор мекунад (офлайн)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  google_mlkit_translation: ^0.11.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
